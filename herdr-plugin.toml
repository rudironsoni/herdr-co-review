# Herdr plugin manifest for co-review.
#
# Installing this as a Herdr plugin gives you a "Co-review this PR" action.
# GitHub PR URL intercept is off by default (see the commented
# [[link_handlers]] block below). The canonical entry point is still
# `co-review start <pr>`, run from inside your repo checkout.

id = "rudironsoni.co-review"
name = "co-review"
version = "2.1.0"
min_herdr_version = "0.8.0"
description = "Interactive, split-screen PR co-review between you and your AI agent."
platforms = ["linux", "macos"]

# On install, put a `co-review` binary in bin/: download the prebuilt release
# asset when this checkout is the repo that publishes it
# (elKei24/herdr-co-review), otherwise build the checked-out source with
# cargo — the asset is only trusted when its provenance matches the checkout.
[[build]]
command = ["bash", "scripts/install-binary.sh"]

# `start` reads the pane cwd (and a clicked PR URL, if a link handler is on)
# from $HERDR_PLUGIN_CONTEXT_JSON. The wrapper restores a usable PATH
# (herdr runs plugin commands with a minimal one) and resolves the binary
# under $HERDR_PLUGIN_ROOT.
[[actions]]
id = "start-from-url"
title = "Co-review this pull request"
contexts = ["workspace", "pane"]
command = ["bash", "scripts/run-action.sh", "start"]

# Off by default. Uncomment this table and reinstall or relink the plugin
# to intercept Ctrl+click on GitHub PR URLs.
# [[link_handlers]]
# id = "github-pr"
# title = "Co-review this PR"
# pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
# action = "start-from-url"
